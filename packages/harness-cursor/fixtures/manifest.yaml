# Fixture provenance manifest. Recorded streams are sanitized: request/session
# ids, timestamps, paths, model narration, and tool payload contents are replaced
# with neutral placeholders while frame types, shapes, and ordering stay intact.
#
# `expectations` (W3.8) are the STREAM SEMANTICS the conformance test asserts
# through core streamExpectationViolations. Cursor has no typed rate-limit
# path — transient conditions surface only as generic errors.
cli: cursor
fixtures:
  basic-run.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 0
      tool_error_results: 2
      typed_rate_limit: false
  session-resume.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: false
  # Plan-mode createPlan recovery fixtures (Defect 1). Replayed with planMode=true
  # by src/plan.test.ts, NOT by the root conformance loop (which is agent-mode).
  plan/plan-empty-uri-inline.jsonl:
    source: synthetic
  plan/plan-valid-uri.jsonl:
    source: synthetic
  plan/plan-no-plan.jsonl:
    source: synthetic
  plan/plan-ask-workreport-recorded.jsonl:
    source: recorded
    cli_version: "2026.07.23-e383d2b"
    recorded_at: "2026-07-26"
    sanitized: "ids, timestamps, paths, narration, tool payload contents"
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      typed_rate_limit: false
  # Defensive shape: Ask does not normally emit createPlan, but a stale/vendor
  # frame must never outrank the final model-authored WorkReport.
  plan/plan-ask-createplan-precedence.jsonl:
    source: synthetic
